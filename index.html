<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Universo</title>

  <!-- ESTILOS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* respaldo mínimo por si el CSS tarda */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Mi Universo</h1>
    <button id="loginBtn">Editar</button>
  </header>

  <!-- SUBIDA (solo creador) -->
  <section id="uploadSection" class="upload" style="display:none;">
    <input
      id="uploadInput"
      type="file"
      accept="image/*"
      multiple
    />
    <p>Puedes subir fotos desde tu iPhone</p>
  </section>

  <!-- GALERÍA -->
  <main id="gallery" class="gallery">
    <!-- fotos dinámicas -->
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© Mi Universo</p>
  </footer>

  <!-- SCRIPT (SIEMPRE AL FINAL) -->
  <script src="script.js"></script>

</body>
</html>
